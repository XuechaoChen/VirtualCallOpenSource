name: Build VirtualCallOpenSource with AndroidDependencyLib

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=1g -Xmx2g"

    steps:
      - name: Checkout AndroidDependencyLib
        uses: actions/checkout@v4
        with:
          repository: XuechaoChen/AndroidDependencyLib
          path: AndroidDependencyLib

      - name: Checkout VirtualCallOpenSource
        uses: actions/checkout@v4
        with:
          repository: XuechaoChen/VirtualCallOpenSource
          path: VirtualCallOpenSource

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clean Gradle daemon cache
        run: |
          rm -rf ~/.gradle/daemon
          rm -rf ~/.gradle/caches
          cd VirtualCallOpenSource && ./gradlew --stop || true

      - name: Upgrade Gradle wrapper to 7.5.1
        working-directory: VirtualCallOpenSource
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-7.5.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        working-directory: VirtualCallOpenSource
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: VirtualCallOpenSource
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: VirtualCallOpenSource/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
